name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest pytest-asyncio
      - name: Lint
        run: ruff check app tests
      - name: Test
        env:
          ANTHROPIC_API_KEY: dummy
          ELEVENLABS_API_KEY: dummy
          DEEPGRAM_API_KEY: dummy
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy
          SUPABASE_ANON_KEY: dummy
        run: pytest -q

  mobile:
    name: Mobile (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install (no audit, no lockfile required for first build)
        run: npm install --no-audit --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit
